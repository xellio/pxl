name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Test
        run: go test -race ./...

      - name: Build binaries
        run: |
          for pair in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            GOOS="${pair%%/*}"
            GOARCH="${pair##*/}"
            out="pxl-${GOOS}-${GOARCH}"
            [ "$GOOS" = "windows" ] && out="${out}.exe"
            GOOS=$GOOS GOARCH=$GOARCH go build -ldflags="-s -w" -o "dist/${out}" ./cli/main.go
          done

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
